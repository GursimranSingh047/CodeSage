name: CodeSage CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Install test target dependencies
        run: |
          cd test-target-repo
          pip install -r requirements.txt

      - name: Run Seeded Benchmark Tests (Module 1)
        run: |
          cd test-target-repo
          pytest -v tests/

      - name: Run Backend & Agent Unit and Integration Tests (Modules 2–11)
        run: |
          pytest -v tests/

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build frontend
        working-directory: dashboard
        run: npm run build
